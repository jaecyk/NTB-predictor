services:
  - type: web
    name: ntb-predictor-api
    runtime: python
    buildCommand: pip install -r requirements_backend.txt
    startCommand: uvicorn backend_main_hosted:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ntb-predictor-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: ntb-predictor-db
    plan: free
